services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: stream-screen
    restart: always
    ports:
      - "1935:1935"
      - "8554:8554"
      - "8888:8888"
      - "8889:8889"
      - "9997:9997"
      - "8189:8189/udp"
    volumes:
      - ./mediamtx_record:/recordings
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro