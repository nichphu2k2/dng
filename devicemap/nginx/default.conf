upstream backend {
    server backend:3000;
}

upstream mediamtx_hls {
    server mediamtx:8888;
}

upstream mediamtx_webrtc {
    server mediamtx:8889;
}

upstream mediamtx_api {
    server mediamtx:9997;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    #
    # Backend API (prefix /api/ is kept, backend routes expect it)
    #
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
    }

    #
    # Uploaded map files served by the backend (express.static "/uploads")
    #
    location /uploads/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
    }

    #
    # Plane images / device icons / user avatars served by the backend (express.static "/image")
    #
    location /image/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
    }

    #
    # Socket.IO / WebSocket
    #
    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    #
    # MediaMTX API
    #
    location /mediamtx/api/ {
        rewrite ^/mediamtx/api/(.*)$ /$1 break;
        proxy_pass http://mediamtx_api;
    }

    #
    # HLS
    #
    location /hls/ {
        rewrite ^/hls/(.*)$ /$1 break;
        proxy_pass http://mediamtx_hls;

        proxy_http_version 1.1;
        proxy_buffering off;
    }

    #
    # WebRTC / WHEP / WHIP
    #
    location /webrtc/ {
        rewrite ^/webrtc/(.*)$ /$1 break;

        proxy_pass http://mediamtx_webrtc;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    #
    # Static assets: match /assets/ anywhere in the path so relative assets always load
    # regardless of root, proxy, or nested subpaths.
    #
    location ~* /assets/(.*)$ {
        alias /usr/share/nginx/html/assets/$1;
    }

    #
    # Universal subpath rewrite:
    # If any request arrives with a subpath prefix before known backend endpoints:
    # e.g. /devicemap/api/..., /custom/api/..., /any/webrtc/..., /any/socket.io/..., etc.
    # Rewrite to remove the prefix and route to the internal endpoint.
    #
    location ~* ^/(?:.+)/(api|uploads|image|socket\.io|webrtc|hls|mediamtx)(/.*)?$ {
        rewrite ^/(?:.+)/(api|uploads|image|socket\.io|webrtc|hls|mediamtx)(/.*)?$ /$1$2 last;
    }

    #
    # Support /devicemap/ prefix for direct access or internal rewrites
    #
    location ^~ /devicemap/ {
        rewrite ^/devicemap/(.*)$ /$1 last;
    }

    #
    # Frontend (SPA)
    #
    location / {
        try_files $uri $uri/ /index.html;
    }
}